# Opt-in observability overlay — local traces, metrics, and dashboards.
#
# Usage (dev stack + observability):
#   docker compose --env-file .env \
#     -f docker/compose.yml \
#     -f docker/compose.dev.yml \
#     -f docker/compose.observability.yml \
#     up -d
#
# Or via the build script:
#   ./scripts/build-dev.sh --with-obs
#
# Ports bound to 127.0.0.1 ONLY (never 0.0.0.0) so they are not reachable from
# the internet on a public host. From a workstation, reach the UIs on a remote
# headless host via an SSH tunnel, e.g.:
#   ssh -L 16686:localhost:16686 -L 3001:localhost:3001 -L 9090:localhost:9090 user@host
#   16686  Jaeger UI         http://localhost:16686
#   9090   Prometheus        http://localhost:9090
#   3001   Grafana           http://localhost:3001  (admin / GRAFANA_ADMIN_PASSWORD)
#   3100   Loki API          http://localhost:3100
#   4317   OTLP gRPC         (for gRPC exporters; this app uses OTLP HTTP)
#   4318   OTLP HTTP         (set OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318)
#
# The overlay enables OTEL for api/worker/scheduler and API metrics automatically. Override
# METRICS_ALLOW_CIDRS when Docker uses a custom bridge pool outside 172.16.0.0/12.

services:
  api:
    environment:
      ENABLE_METRICS: 'true'
      # Docker's default bridge pools live in 172.16.0.0/12. Override this for custom networks.
      METRICS_ALLOW_CIDRS: ${METRICS_ALLOW_CIDRS:-172.16.0.0/12}
      OTEL_ENABLED: 'true'
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_METRICS_EXPORT_ENABLED: 'false'

  worker:
    environment:
      OTEL_ENABLED: 'true'
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_METRICS_EXPORT_ENABLED: 'true'

  scheduler:
    environment:
      OTEL_ENABLED: 'true'
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_METRICS_EXPORT_ENABLED: 'true'

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
    restart: unless-stopped
    command: ['--config=/etc/otel/config.yaml']
    mem_limit: 512m
    volumes:
      - ./otel-collector/config.yaml:/etc/otel/config.yaml:ro
    ports:
      # Bound to 127.0.0.1 only — never 0.0.0.0. On a headless/remote host these
      # UIs are reached over an SSH tunnel, never exposed to the internet.
      - '127.0.0.1:4317:4317' # OTLP gRPC
      - '127.0.0.1:4318:4318' # OTLP HTTP
      - '127.0.0.1:8888:8888' # collector internal metrics (scraped by Prometheus)
      - '127.0.0.1:8889:8889' # Prometheus exporter for app metrics forwarded by collector

  jaeger:
    image: jaegertracing/jaeger:2.23.0@sha256:3823829974ccfc2485d2e48b165579091f32295022ae80ca49704e2f4834116e
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '127.0.0.1:16686:16686' # Jaeger UI

  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - '127.0.0.1:9090:9090'

  loki:
    image: grafana/loki:3.7.10@sha256:b43c257ccfc925d4a50b8717cac61a3b51df8c48d01847936057e5c4075a24a7
    restart: unless-stopped
    command: ['-config.file=/etc/loki/config.yaml']
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    ports:
      - '127.0.0.1:3100:3100'

  alloy:
    image: grafana/alloy:v1.22.0@sha256:9acc2529bc1edb7f5b2bd801dd8334ebc80c158e3a9e5526ecd7c9a273d43189
    restart: unless-stopped
    command: ['run', '/etc/alloy/config.alloy', '--storage.path=/var/lib/alloy/data']
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-nestjs-fastify-nx}
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      # SECURITY: `:ro` guards the socket inode, not the API calls made through it — Alloy holds
      # full Docker Engine access either way (read any container's secrets, mount the host, i.e.
      # root). It needs the socket for log discovery, so the mount stays and the trust boundary is
      # the host. On a shared or untrusted host, front it with a read-only docker-socket-proxy.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    restart: unless-stopped
    environment:
      # This overlay binds every UI to 127.0.0.1 (reached via SSH tunnel), so the
      # `admin` fallback is acceptable for local dev only. If you ever expose Grafana
      # beyond localhost (public port, reverse proxy, shared host), you MUST set a
      # strong GRAFANA_ADMIN_PASSWORD in .env — there is no boot-time guard here
      # because this stack is not part of the production deployment path.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_HTTP_PORT: '3001'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - '127.0.0.1:3001:3001'
    depends_on:
      - prometheus
      - jaeger
      - loki

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:
