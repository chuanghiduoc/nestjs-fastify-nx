# Production overlay — compose with the base `compose.yml` to deploy released
# images:
#
#   docker compose -f docker/compose.yml -f docker/compose.prod.yml up -d
#
# API_IMAGE / WORKER_IMAGE / SCHEDULER_IMAGE / MIGRATION_IMAGE are mandatory immutable
# registry digests. Runtime variables come from separate service-specific env files so API,
# worker, scheduler and migration do not receive one another's credentials.
#
# This file deliberately omits `build:` so a thin host (no source checkout)
# can pull and run from the registry alone.
#
# Note: the base compose.yml publishes postgres/redis/minio host ports for dev
# convenience (short-form mappings bind 0.0.0.0 — reachable from the internet on
# a host with a public IP). This prod overlay strips those bindings via
# `ports: !override []` so the data tier is reachable only over the internal
# compose network (apps connect by service name: postgres:5432, redis-cache:6379,
# redis-queue:6380). Only the api port is published. Host firewall rules remain a
# sensible defense-in-depth layer, but are no longer the sole protection.

# x-anchors are reused across api/worker/scheduler so policy stays in one place.
x-app-security: &app-security
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    # /tmp is read-only otherwise; worker/scheduler write liveness probes here,
    # api uses it for fastify multipart upload spool. noexec/nosuid blocks
    # arbitrary execution if an attacker writes a binary into the writable mount.
    - /tmp:rw,noexec,nosuid,size=64m
  ulimits:
    nofile:
      soft: 65536
      hard: 65536

x-app-logging: &app-logging
  logging:
    driver: json-file
    options:
      max-size: '50m'
      max-file: '5'
      labels: 'service'

services:
  # docker-network hostnames (postgres / redis-cache / redis-queue) are
  # determined by compose itself, so we hardcode them here regardless of
  # what `.env` carries — operators only need to set credentials, not topology.
  # MAIL_HOST and STORAGE_ENDPOINT are intentionally NOT overridden: prod
  # deployments terminate at real SMTP / real S3 endpoints supplied via .env.

  postgres:
    <<: *app-logging
    # Strip the host-port mapping inherited from compose.yml — the data tier
    # talks to apps over the internal compose network only.
    ports: !override []
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.25'

  redis-cache:
    <<: *app-logging
    ports: !override []
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  redis-queue:
    <<: *app-logging
    ports: !override []
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  minio:
    <<: *app-logging
    # Forced explicit like every other production secret: the base file defaults these to
    # minioadmin/minioadmin, and nothing else would make an operator notice they stayed on the
    # well-known default while every other credential was filled in.
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports: !override []

  # Self-hosted MinIO is a supported production backend (hardened above), but nothing in the app
  # creates the bucket — every presign/confirm would fail until an operator made it by hand. This is
  # the same one-shot the dev stack runs, so the orphan-expiry rule is applied identically.
  minio-init:
    <<: *app-logging
    image: minio/mc:RELEASE.2025-05-21T01-59-54Z
    restart: 'no'
    depends_on:
      minio:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # mc writes its alias config under $HOME before it can talk to the server, and dropping every
    # capability leaves it unable to create /root/.mc. Point it at the tmpfs instead of handing the
    # capability back.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    environment:
      MC_CONFIG_DIR: /tmp/.mc
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      STORAGE_BUCKET: ${STORAGE_BUCKET:?STORAGE_BUCKET is required}
      MINIO_ORPHAN_EXPIRY_DAYS: ${MINIO_ORPHAN_EXPIRY_DAYS:-1}
    entrypoint: >
      /bin/sh -c "
        set -eu;
        case "$$MINIO_ORPHAN_EXPIRY_DAYS" in ''|*[!0-9]*|0) echo 'minio-init: MINIO_ORPHAN_EXPIRY_DAYS must be a positive integer'; exit 1;; esac;
        connected=0;
        for i in $$(seq 1 15); do
          if mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\"; then connected=1; break; fi;
          echo 'waiting for minio... attempt '$$i; sleep 2;
        done;
        [ "$$connected" = 1 ] || { echo 'minio-init: cannot reach minio after 30s'; exit 1; };
        mc mb --ignore-existing \"local/$$STORAGE_BUCKET\";
        mc ilm rule remove --all --force \"local/$$STORAGE_BUCKET\" 2>/dev/null || true;
        mc ilm rule add --expire-days "$$MINIO_ORPHAN_EXPIRY_DAYS" --prefix 'uploads/' \"local/$$STORAGE_BUCKET\";
        echo 'bucket ready: '$$STORAGE_BUCKET
      "

  malware-scanner:
    <<: *app-logging
    image: clamav/clamav:1.4.3@sha256:75fb5fd95fcbe1d7e6d240c369c1572b686ee2c95949d1042b5148de8eddebb4
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # clamav's entrypoint creates /run/clamav and drops to the clamav user before starting clamd.
    # With every capability dropped it cannot, and the container exits 1 with "can't change
    # ownership of /run/clamav" — which then blocks the worker, since it waits for this to be
    # healthy. These four are what that setup step needs; clamd itself keeps none of them.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      # Without AlertExceedsMax, ClamAV reports a file it refused to scan as clean. With it, the
      # skip comes back as Heuristics.Limits.Exceeded and the worker records SKIPPED_TOO_LARGE.
      CLAMD_CONF_AlertExceedsMax: 'yes'
      # 2 GiB is ClamAV's internal per-file ceiling; asking for more is silently clamped.
      CLAMD_CONF_MaxFileSize: '2G'
      CLAMD_CONF_MaxScanSize: '2G'
      CLAMD_CONF_StreamMaxLength: '2G'
    volumes:
      - clamav_signatures:/var/lib/clamav
    healthcheck:
      test: ['CMD', 'clamdscan', '--ping', '1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # Migration intentionally skips read_only because pnpm + prisma migrate write
  # transient files outside /tmp during migration apply. Other hardening still applies.
  migration:
    <<: *app-logging
    image: ${MIGRATION_IMAGE:?Set MIGRATION_IMAGE to an immutable image digest}
    env_file:
      - path: ../.env.migration
        required: true
    # The base file can only carry the short form (docker stack deploy rejects `condition:`), so the
    # real wait is layered here. Without it migration races a cold Postgres and can exhaust its
    # retry budget before the first healthcheck passes, leaving api/worker/scheduler gated behind a
    # failed one-shot.
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  db-grants:
    <<: *app-logging
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER is required}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      API_DB_USER: ${API_DB_USER:?API_DB_USER is required}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?API_DB_PASSWORD is required}
      WORKER_DB_USER: ${WORKER_DB_USER:?WORKER_DB_USER is required}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?WORKER_DB_PASSWORD is required}
      SCHEDULER_DB_USER: ${SCHEDULER_DB_USER:?SCHEDULER_DB_USER is required}
      SCHEDULER_DB_PASSWORD: ${SCHEDULER_DB_PASSWORD:?SCHEDULER_DB_PASSWORD is required}
    volumes:
      - ./postgres/provision-runtime-roles.sh:/provision-runtime-roles.sh:ro
    entrypoint: ['/bin/sh', '/provision-runtime-roles.sh']
    depends_on:
      migration:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: 'no'

  api:
    <<: [*app-security, *app-logging]
    image: ${API_IMAGE:?Set API_IMAGE to an immutable image digest}
    env_file:
      - path: ../.env.api
        required: true
    environment:
      NODE_ENV: production
      TZ: ${TZ:-UTC}
      REDIS_CACHE_HOST: redis-cache
      REDIS_QUEUE_HOST: redis-queue
      REDIS_QUEUE_PORT: '6380'
      # Durable, crash-safe domain events (required in production — enforced by env validation).
      EVENT_PUBLISHER_DRIVER: outbox
    # Loopback by default — not internet-facing. Set API_BIND_HOST=0.0.0.0 for
    # direct exposure, but Docker's port publishing BYPASSES ufw/firewalld; gate
    # it with a cloud security group or a DOCKER-USER rule, not the host firewall.
    ports:
      - '${API_BIND_HOST:-127.0.0.1}:${API_PORT:-3000}:${PORT:-3000}'
    # Long-form gates plain-compose deploys on migration completion + dependency
    # health so the api doesn't crash-loop on a fresh DB. compose.swarm.yml
    # overrides back to short-form because `docker stack deploy` rejects the
    # `condition:` key (apps retry DB/Redis connections at boot regardless).
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      db-grants:
        condition: service_completed_successfully
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    restart: unless-stopped
    # Liveness probe — process is alive. Use /api/v1/health/ready for K8s readiness;
    # /api/v1/health (full) for ops dashboards. Docker should only kill on liveness fail.
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--quiet',
          '--spider',
          '--tries=1',
          'http://127.0.0.1:${PORT:-3000}/api/v1/health/live',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    deploy:
      replicas: ${API_REPLICAS:-1}
      update_config:
        parallelism: 1
        order: start-first
        delay: 10s
        monitor: 30s
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
        reservations:
          memory: 256M
          cpus: '0.5'

  worker:
    <<: [*app-security, *app-logging]
    image: ${WORKER_IMAGE:?Set WORKER_IMAGE to an immutable image digest}
    env_file:
      - path: ../.env.worker
        required: true
    environment:
      NODE_ENV: production
      # Pinned: .env.worker seeded from .env.example would carry the api's name.
      OTEL_SERVICE_NAME: nestjs-fastify-worker
      REDIS_CACHE_HOST: redis-cache
      REDIS_QUEUE_HOST: redis-queue
      REDIS_QUEUE_PORT: '6380'
      MALWARE_SCANNER_ENABLED: 'true'
      MALWARE_SCANNER_HOST: malware-scanner
      MALWARE_SCANNER_PORT: '3310'
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      db-grants:
        condition: service_completed_successfully
      redis-queue:
        condition: service_healthy
      malware-scanner:
        condition: service_healthy
    restart: unless-stopped
    # stop_grace_period must exceed worst-case BullMQ job timeout + lock duration
    # so in-flight jobs complete before SIGKILL. Email + S3 HEAD jobs are
    # sub-second; 45s gives a comfortable buffer. Bump if longer-running handlers
    # are introduced.
    stop_grace_period: 45s
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
      update_config:
        parallelism: 1
        order: start-first
        delay: 10s
        monitor: 30s
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
        reservations:
          memory: 256M
          cpus: '0.5'

  scheduler:
    <<: [*app-security, *app-logging]
    image: ${SCHEDULER_IMAGE:?Set SCHEDULER_IMAGE to an immutable image digest}
    env_file:
      - path: ../.env.scheduler
        required: true
    environment:
      NODE_ENV: production
      OTEL_SERVICE_NAME: nestjs-fastify-scheduler
      REDIS_CACHE_HOST: redis-cache
      REDIS_QUEUE_HOST: redis-queue
      REDIS_QUEUE_PORT: '6380'
      # Durable, crash-safe domain events (required in production — enforced by env validation).
      EVENT_PUBLISHER_DRIVER: outbox
    # Every cron and the outbox relay are guarded by a Redis ownership lease.
    # Multiple replicas provide failover; only the elected instance executes.
    # 30s grace period: VACUUM and partition DDL jobs can run up to ~20s;
    # the Docker default of 10s would SIGKILL them mid-operation.
    stop_grace_period: 30s
    deploy:
      replicas: ${SCHEDULER_REPLICAS:-1}
      update_config:
        order: start-first
        parallelism: 1
      placement:
        max_replicas_per_node: 1
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
          cpus: '0.25'
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      db-grants:
        condition: service_completed_successfully
      redis-queue:
        condition: service_healthy
    restart: unless-stopped

volumes:
  clamav_signatures:
