# Local-test overlay for prod-parity verification. DO NOT use in any real
# deployment — `environment:` overrides the dev `.env` insecure defaults that
# the production validator rejects (minioadmin, admin/admin, etc).
# Adds mailpit so the worker's SMTP `verify()` at boot succeeds.
#
# Reused by `./scripts/build-prod.sh` for the compose-mode auto-boot path
# (Swarm and plain compose both consume the same env shape).

services:
  mailpit:
    image: axllent/mailpit:v1.30.4
    restart: unless-stopped
    ports:
      # Loopback-only (matches the observability overlay): the UI is a dev convenience,
      # never exposed host-wide. Override the port numbers if another local stack already
      # binds 1025/8025 (e.g. another project's mailpit).
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025'

  garage:
    # The production overlay strips all data-tier host ports. Re-enable the S3 API only for this
    # explicitly local smoke overlay, loopback-bound so the script's advertised endpoint is reachable.
    ports: !override
      - '127.0.0.1:${GARAGE_PORT:-9000}:3900'

  garage-init:
    environment:
      STORAGE_ACCESS_KEY: GKc0ffee0000000000000000aa
      STORAGE_SECRET_KEY: 10ca17e510ca17e510ca17e510ca17e510ca17e510ca17e510ca17e510ca17e5
      STORAGE_BUCKET: uploads
      STORAGE_ORPHAN_EXPIRY_DAYS: ${STORAGE_ORPHAN_EXPIRY_DAYS:-1}
    deploy:
      restart_policy:
        condition: none

  api:
    environment:
      NODE_ENV: production
      REDIS_CACHE_PASSWORD: ${REDIS_CACHE_PASSWORD:?REDIS_CACHE_PASSWORD is required}
      REDIS_QUEUE_PASSWORD: ${REDIS_QUEUE_PASSWORD:?REDIS_QUEUE_PASSWORD is required}
      STORAGE_ACCESS_KEY: GKc0ffee0000000000000000aa
      STORAGE_SECRET_KEY: 10ca17e510ca17e510ca17e510ca17e510ca17e510ca17e510ca17e510ca17e5
      STORAGE_ENDPOINT: http://garage:3900
      STORAGE_BUCKET: uploads
      MAIL_HOST: mailpit
      MAIL_PORT: '1025'
      MAIL_DEFAULT_EMAIL: test@localtest.local
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: localtest-better-auth-secret-min-32-chars
      FRONTEND_BASE_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      garage-init:
        condition: service_completed_successfully

  worker:
    environment:
      NODE_ENV: production
      REDIS_QUEUE_PASSWORD: ${REDIS_QUEUE_PASSWORD:?REDIS_QUEUE_PASSWORD is required}
      STORAGE_ACCESS_KEY: GKc0ffee0000000000000000aa
      STORAGE_SECRET_KEY: 10ca17e510ca17e510ca17e510ca17e510ca17e510ca17e510ca17e510ca17e5
      STORAGE_ENDPOINT: http://garage:3900
      STORAGE_BUCKET: uploads
      MAIL_HOST: mailpit
      MAIL_PORT: '1025'
      MAIL_DEFAULT_EMAIL: test@localtest.local
    depends_on:
      garage-init:
        condition: service_completed_successfully

  scheduler:
    environment:
      NODE_ENV: production
      REDIS_QUEUE_PASSWORD: ${REDIS_QUEUE_PASSWORD:?REDIS_QUEUE_PASSWORD is required}
      STORAGE_ACCESS_KEY: GKc0ffee0000000000000000aa
      STORAGE_SECRET_KEY: 10ca17e510ca17e510ca17e510ca17e510ca17e510ca17e510ca17e510ca17e5
      STORAGE_ENDPOINT: http://garage:3900
      STORAGE_BUCKET: uploads
      MAIL_HOST: mailpit
      MAIL_PORT: '1025'
      MAIL_DEFAULT_EMAIL: test@localtest.local
    depends_on:
      garage-init:
        condition: service_completed_successfully
