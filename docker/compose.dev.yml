# Dev overlay — extends compose.yml with build contexts, dev-only services,
# and container-to-container networking overrides.
#
# INTERNAL PORT REFERENCE (fixed, not configurable):
#   postgres:5432, redis-cache:6379, redis-queue:6380, minio:9000, mailpit:1025
# Apps inside containers connect to these via service names (e.g. redis-cache:6379).
# .env port vars (REDIS_CACHE_PORT, etc.) are for HOST apps only (dev.sh).

services:
  # One-shot: creates the STORAGE_BUCKET and its orphan-expiry lifecycle rule if
  # absent. Runs after minio is healthy; restarts on failure until mc connects.
  minio-init:
    image: minio/mc:RELEASE.2025-05-21T01-59-54Z
    restart: 'no'
    depends_on:
      minio:
        condition: service_healthy
    env_file: ../.env
    entrypoint: >
      /bin/sh -c "
        set -eu;
        case "$$MINIO_ORPHAN_EXPIRY_DAYS" in ''|*[!0-9]*|0) echo 'minio-init: MINIO_ORPHAN_EXPIRY_DAYS must be a positive integer'; exit 1;; esac;
        connected=0;
        for i in $$(seq 1 15); do
          if mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\"; then connected=1; break; fi;
          echo 'waiting for minio... attempt '$$i; sleep 2;
        done;
        [ "$$connected" = 1 ] || { echo 'minio-init: cannot reach minio after 30s'; exit 1; };
        mc mb --ignore-existing \"local/$$STORAGE_BUCKET\";
        mc ilm rule remove --all --force \"local/$$STORAGE_BUCKET\" 2>/dev/null || true;
        mc ilm rule add --expire-days "$$MINIO_ORPHAN_EXPIRY_DAYS" --prefix 'uploads/' \"local/$$STORAGE_BUCKET\";
        echo 'bucket ready: '$$STORAGE_BUCKET
      "

  migration:
    build:
      context: ..
      dockerfile: Dockerfile
      target: migration-dev
    env_file: ../.env
    # The base file can only carry the short form (docker stack deploy rejects `condition:`), so the
    # actual wait is layered here. Without it migration races a cold Postgres and burns its retry
    # budget before the first healthcheck passes.
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Container-to-container: hostname is the service name, port is the container port (5432).
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-nestjs_db}

  # Redis UI for browsing cache and queue data — http://localhost:8081
  # Connects to both redis-cache (db 0-5) and redis-queue (db 0-2).
  redis-commander:
    # Unmaintained upstream (last release ~2020). Dev-only tool — pin if instability surfaces.
    image: rediscommander/redis-commander:latest
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    environment:
      TZ: ${TZ:-UTC}
      # Comma-separated Redis hosts: label:host:port:dbIndex
      REDIS_HOSTS: cache:redis-cache:6379:0,queue:redis-queue:6380:0
    ports:
      - '${REDIS_COMMANDER_PORT:-8081}:8081'
    depends_on:
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy

  # Fake SMTP for dev/CI mail testing — UI at http://localhost:8025.
  # Prod deployments terminate at real SMTP via MAIL_HOST in .env.
  mailpit:
    image: axllent/mailpit:v1.30.4
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
    environment:
      TZ: ${TZ:-UTC}
    ports:
      - '${MAIL_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'

  api:
    build:
      context: ..
      dockerfile: Dockerfile
      target: api-dev
    ports:
      - '${API_PORT:-3000}:${PORT:-3000}'
      - '${API_DEBUG_PORT:-9229}:9229'
    env_file: ../.env
    environment:
      NODE_ENV: development
      # Must stay 'false' in every image: pino-pretty is a devDependency and the images
      # install --prod, so pino cannot resolve the transport target and dies on boot.
      LOG_PRETTY: 'false'
      TZ: ${TZ:-UTC}
      # The image only EXPOSEs 9229 and the port is published above — without this the
      # inspector is never actually opened, so attaching silently fails. Bind 0.0.0.0, not
      # the default 127.0.0.1: a debugger on the host cannot reach a listener bound to the
      # container's loopback. Empty by default so the inspector stays OFF unless asked for
      # (`NODE_DEBUG_OPTIONS=--inspect=0.0.0.0:9229`, or `--inspect-brk=…` to pause on the
      # first line). It stays a dev-overlay knob and is absent from the production images.
      NODE_OPTIONS: ${NODE_DEBUG_OPTIONS:-}
      # Container-to-container connection uses service names and internal ports.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-nestjs_db}
      REDIS_CACHE_HOST: redis-cache
      REDIS_CACHE_PORT: '6379'
      REDIS_QUEUE_HOST: redis-queue
      REDIS_QUEUE_PORT: '6380'
      STORAGE_ENDPOINT: http://minio:9000
      # Presigned upload/download URLs are signed against the host-reachable
      # address so a browser outside the compose network can resolve them.
      STORAGE_PUBLIC_ENDPOINT: http://localhost:${MINIO_PORT:-9000}
      MAIL_HOST: mailpit
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
      target: worker-dev
    env_file: ../.env
    environment:
      NODE_ENV: development
      LOG_PRETTY: 'false'
      TZ: ${TZ:-UTC}
      # .env carries the api's name, which would otherwise label this process as the api.
      OTEL_SERVICE_NAME: nestjs-fastify-worker
      # Container-to-container connection uses service names and internal ports.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-nestjs_db}
      REDIS_CACHE_HOST: redis-cache
      REDIS_CACHE_PORT: '6379'
      REDIS_QUEUE_HOST: redis-queue
      REDIS_QUEUE_PORT: '6380'
      STORAGE_ENDPOINT: http://minio:9000
      MAIL_HOST: mailpit
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      redis-queue:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'sh',
          '-c',
          'test -f /tmp/worker-alive && [ $$(( $$(date +%s) - $$(date -r /tmp/worker-alive +%s) )) -lt 60 ]',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  scheduler:
    build:
      context: ..
      dockerfile: Dockerfile
      target: scheduler-dev
    env_file: ../.env
    environment:
      NODE_ENV: development
      LOG_PRETTY: 'false'
      TZ: ${TZ:-UTC}
      OTEL_SERVICE_NAME: nestjs-fastify-scheduler
      # Container-to-container connection uses service names and internal ports.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-nestjs_db}
      REDIS_CACHE_HOST: redis-cache
      REDIS_CACHE_PORT: '6379'
      REDIS_QUEUE_HOST: redis-queue
      REDIS_QUEUE_PORT: '6380'
      STORAGE_ENDPOINT: http://minio:9000
      MAIL_HOST: mailpit
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      redis-queue:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'sh',
          '-c',
          'test -f /tmp/scheduler-alive && [ $$(( $$(date +%s) - $$(date -r /tmp/scheduler-alive +%s) )) -lt 60 ]',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
