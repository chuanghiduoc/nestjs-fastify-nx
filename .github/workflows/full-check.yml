# PR CI runs `nx affected`, which only re-checks projects touched by the diff — a
# pre-existing lint/type/boundary violation in an untouched project can sit red in
# the editor while PR checks stay green. This job runs the SAME checks across the
# WHOLE workspace on a nightly schedule and on every push to main, so drift in
# untouched code is caught without slowing down PRs.
name: full-check

on:
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC daily
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: full-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # SHA-pinned like every other workflow here: a moving tag lets an upstream compromise run
      # with this job's token without any change landing in the repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          # Pinned to match package.json `packageManager` and the Dockerfiles.
          version: 11.14.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          # Matches package.json engines (>=24), the Dockerfile base, and the other workflows.
          # `engine-strict` is off, so a mismatch here does not fail — it just quietly validates the
          # whole workspace against a Node major the project does not ship on.
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync check
        run: pnpm nx sync:check

      - name: Format check (all)
        run: pnpm nx format:check --all

      - name: Lint + typecheck ALL projects
        run: pnpm nx run-many -t lint typecheck --all --parallel=3

      - name: Unit tests + coverage thresholds (all)
        run: pnpm nx run-many -t test --all -- --coverage
