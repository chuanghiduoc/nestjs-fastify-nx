name: Version and Tag

# Cuts a release with Nx Release: derives the next version from conventional
# commits, updates package.json + CHANGELOG.md, and opens a PR with those
# changes. Merging that PR is what triggers `tag-release.yml`, which tags the
# merge commit and hands off to `release.yml` to build, scan, sign and publish.
#
# It opens a PR rather than pushing to `main` because `main` enforces
# pull-request review with `enforce_admins` on and no bypass allowance — no
# token can push to it, so the previous push-based version of this workflow
# could never succeed. Going through a PR also means the release commit passes
# the same required checks as everything else, and needs no PAT: the default
# GITHUB_TOKEN can open and auto-merge a PR.
#
# Manual trigger only — releasing is a deliberate act, not every push to main.

on:
  workflow_dispatch:
    inputs:
      specifier:
        description: 'Version bump — leave as "auto" to derive from conventional commits'
        required: true
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto
      dry-run:
        description: 'Preview only — no branch, commit, or PR'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-version
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history + tags so Nx Release resolves the current version from
          # the last `v*` tag and computes the diff since it.
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.14.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # git-commit/tag/push are all disabled: this job owns the branch and PR, and the tag is
      # created only after the PR merges, against the squashed commit that actually lands on main.
      - name: Nx Release (version + changelog)
        id: release
        env:
          # Passed through env, never interpolated straight into the shell — `${{ }}` in a run
          # block is a shell-injection sink even for workflow_dispatch inputs.
          INPUT_SPECIFIER: ${{ inputs.specifier }}
          INPUT_DRY_RUN: ${{ inputs.dry-run }}
        run: |
          SPECIFIER=""
          if [ "$INPUT_SPECIFIER" != "auto" ]; then
            SPECIFIER="$INPUT_SPECIFIER"
          fi

          COMMON_FLAGS="--git-commit=false --git-tag=false --git-push=false"
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            pnpm nx release version $SPECIFIER $COMMON_FLAGS --dry-run --verbose
            exit 0
          fi

          pnpm nx release version $SPECIFIER $COMMON_FLAGS
          VERSION=$(node -p "require('./package.json').version")
          pnpm nx release changelog "$VERSION" $COMMON_FLAGS
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Open release PR
        if: ${{ inputs.dry-run == false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          BRANCH="release/v${VERSION}"
          git checkout -b "$BRANCH"
          git add -A
          # Subject stays lower-case for commitlint, and `chore(release):` is the marker
          # tag-release.yml matches on after the squash merge.
          git commit -m "chore(release): v${VERSION}" -m "Generated by nx release. Merging this tags v${VERSION} and publishes the images."
          git push --set-upstream origin "$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(release): v${VERSION}" \
            --body "Automated release PR generated by \`nx release\`.

          Merging this commit makes \`tag-release.yml\` tag \`v${VERSION}\` and hand off to \`release.yml\`, which builds, scans with Trivy, signs with cosign and publishes the four images to GHCR.

          See \`CHANGELOG.md\` in this diff for what ships."

          # Merges itself once the required checks pass, so a release needs one manual trigger
          # rather than a trigger plus a babysitter.
          gh pr merge --auto --squash "$BRANCH"
