packages:
  - 'apps/*'
  - 'libs/*'
  - 'libs/composition/*'
  - 'libs/infra/*'
  - 'libs/modules/*'
  - 'tools/*'

# pnpm 11 ships these two on by default; kept explicit as the repo's stated posture.
# minimumReleaseAge (1 day) skips just-published releases — the window a compromised package is
# usually caught and pulled in — and blockExoticSubdeps refuses non-registry transitive sources.
# `trustPolicy: no-downgrade` is deliberately NOT enabled: it fires on long-trusted packages
# (semver, chokidar) whose maintainers merely didn't re-sign provenance, costing far more in
# false positives than it buys.
minimumReleaseAge: 1440
blockExoticSubdeps: true

# pnpm 11 no longer reads config from package.json#pnpm or non-auth .npmrc keys —
# both moved here.
strictPeerDependencies: true
autoInstallPeers: true
# Docker builds run `pnpm install --offline`; verifyDepsBeforeRun would trigger a
# network install on every `pnpm run`/`pnpm nx` and break the offline layer.
verifyDepsBeforeRun: false

# Deny dependency build scripts by default (was onlyBuiltDependencies). Only the three that
# genuinely need to compile/generate at install run; the rest ship prebuilt binaries and worked
# fine denied under pnpm 10, so they stay denied — deny-by-default, not a blanket allow.
allowBuilds:
  '@prisma/engines': true
  nx: true
  prisma: true
  '@parcel/watcher': false
  '@scarf/scarf': false
  '@sentry/node-cpu-profiler': false
  '@swc/core': false
  cpu-features: false
  esbuild: false
  lefthook: false
  less: false
  msgpackr-extract: false
  ssh2: false
  unrs-resolver: false

overrides:
  axios: '>=1.18.0'
  # GHSA-ggr8-5vv4-36mx (high, prototype pollution). Reached only through @prisma/config, which
  # pins 7.x, so an update cannot resolve it. Capped below 9 per the cap-below-next-major policy.
  deepmerge-ts: '>=8.0.0 <9'
  fastify: '>=5.8.5'
  # GHSA-c96f-x56v-gq3h (high, HTTP/2 DoS). @nestjs/platform-fastify pins an exact 9.6.0, so this
  # cannot be resolved by a plain update.
  find-my-way: '>=9.7.0'
  '@hono/node-server': '2.0.10'
  # GHSA-rgw5-rvv9-x895 (high, ReDoS). Capped below the next major per the repo's override policy:
  # an open-ended `>=` let pnpm cross a major boundary and break a peer (see the
  # @babel/plugin-transform-modules-systemjs incident documented in CLAUDE.md).
  brace-expansion: '>=5.0.9 <6'
  yaml: '>=2.8.3'
  follow-redirects: '>=1.16.0'
  picomatch: '>=4.0.4'
  uuid: '^14.0.1'
  fast-uri: '>=4.1.2 <5'
  fast-xml-builder: '>=1.2.0'
  hono: '4.12.27'
  immutable: '5.1.8'
  svgo: '4.0.2'
  # Security floor (>=7.29.4) but capped below 8: 8.x demands @babel/core ^8 while the toolchain
  # (nx → @babel/preset-env 7.x) pins @babel/core 7, so an open >= let pnpm jump to 8.0.1 and fail
  # strictPeerDependencies on any lockfile-updating install. 7.29.7 carries the same fix.
  '@babel/plugin-transform-modules-systemjs': '>=7.29.4 <8'
  esbuild: '>=0.28.1'
  kysely: '>=0.28.17'
  protobufjs: '>=8.0.2'
  qs: '>=6.15.2'
  tmp: '>=0.2.7'
  webpack-dev-server: '>=5.2.6'
  ws: '>=8.21.0'
  form-data: '>=4.0.6'
  multer: '>=2.2.0'
  launch-editor: '>=2.14.1'
  js-yaml: '^4.3.0'
  http-proxy-middleware: '^3.0.6'
  '@opentelemetry/core': '>=2.8.0'
  undici: '>=8.5.0'
  # GHSA-5qjj-4xww-7phc (moderate). Pulled transitively via prisma/@prisma/dev (and better-auth's
  # validation stack). Capped below the next major so a 2.x can't slip a peer out from under the
  # toolchain; 1.4.2 is the latest 1.x and carries the fix.
  valibot: '>=1.4.2 <2'
  # GHSA-83w8-p2f5-377r (high, 7.5) + GHSA-8pvw-jcv7-9cmj (medium). @nestjs/platform-fastify pins an
  # exact 9.3.0 and @bull-board/fastify wants ^9.1.3, so a plain update can't reach the fix; both use
  # it as a regular (non-peer) dependency for static asset serving, whose public API is stable across
  # 9->10 (v10 only raises the engine floor to Fastify 5, already in use — mercurius already resolves
  # 10.1.2). Capped below the next major. Also dedupes to a single @fastify/static version: the floor
  # tracks the highest range any consumer declares, so raise it whenever one moves (@bull-board/fastify
  # went ^9.1.3 -> ^10.1.3 in v9, which split the tree into 10.1.2 + 10.1.3 until this floor followed).
  '@fastify/static': '>=10.1.3 <11'
  # cookie v2 dropped the `parse`/`serialize` exports. light-my-request@6.6.0 (Fastify core dep, and
  # what powers app.inject()) still declares ^1.0.1 and calls serialize(), so v2 breaks e2e outright.
  # Holding every consumer on 1.1.1 also keeps ONE cookie major in the tree: express@5 and engine.io
  # natively want 0.7.x, and three coexisting majors is what triggers the Nx lockfile-pruning bug
  # documented in CLAUDE.md. @fastify/cookie@11 declares ^2.0.0 but only calls parseCookie() and
  # stringifySetCookie(), which 1.1.1 already exports as forward-compat aliases — verified against
  # its source. Re-verify that when bumping @fastify/cookie; lift this pin once light-my-request
  # moves to cookie v2.
  cookie: '>=1.1.1 <2'
  # GHSA-5p2g-fcmc-qvqq + GHSA-w3rx-r6r6-pgpr (high, DoS via infinite loop in JXL/HEIF/ICNS
  # parsers). image-size@0.5.5 is an unused optionalDependency of less (pulled in only by
  # less-loader via @nx/webpack devDependency; this repo has no .less files). No fixed version
  # exists upstream (through 2.0.2), so remove it from the install tree instead of pinning.
  'less@4.5.1>image-size': '-'
  # GHSA-2v37-7h3g-55p8 (high, DoS via infinite loop in customAlphabet/customRandom when
  # called with size=0). Scoped to the nanoid@3 line only — nanoid@5 also resolves elsewhere
  # in the graph and is already patched (>=5.1.6); a bare `nanoid` override would force both
  # lines onto the same version.
  'nanoid@3': '>=3.3.18 <4'
